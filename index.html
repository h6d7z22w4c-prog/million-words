<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Русский на миллион</title>
<style>
:root{--bg:#080d24;--card:#151d3d;--line:#344274;--text:#f7f8ff;--muted:#aab4d4;--violet:#745cff;--cyan:#45d6ff;--gold:#ffd166;--green:#4cda9a;--red:#ff6b85}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17375d 0,transparent 35%),radial-gradient(circle at 90% 10%,#30205e 0,transparent 35%),var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif;min-height:100vh}.top{height:70px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center;padding:0 5%;font-weight:800}.logo{display:flex;gap:10px;align-items:center}.logo b{display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));width:36px;height:36px;border-radius:12px;font-size:22px}.btn{border:0;border-radius:13px;padding:13px 20px;font-weight:800;color:white;background:linear-gradient(135deg,var(--violet),#4f8dff);cursor:pointer}.btn.secondary{background:#ffffff12;border:1px solid #ffffff26}.icon{background:#ffffff0d;border:1px solid #ffffff22;color:white;border-radius:12px;width:40px;height:40px;cursor:pointer}.screen{display:none}.screen.active{display:block}.welcome{max-width:1100px;margin:auto;padding:8vh 6%;display:flex;align-items:center;gap:6vw}.hero{flex:1}.tag{color:#bdf3ff;border:1px solid #45d6ff55;background:#45d6ff12;border-radius:99px;display:inline-block;padding:8px 13px;font-size:13px}.hero h1{font-size:clamp(48px,8vw,88px);line-height:.95;margin:25px 0}.grad{background:linear-gradient(100deg,#fff,#bdeaff,#bba6ff);color:transparent;background-clip:text}.lead{color:var(--muted);font-size:19px;line-height:1.55;max-width:600px}.note{color:var(--muted);font-size:13px;margin-left:12px}.orb{width:300px;height:300px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#ffffff38,transparent 20%),linear-gradient(145deg,#183b65,#352069);border:1px solid #ffffff30;box-shadow:0 0 80px #745cff55;font:900 150px Georgia;color:var(--gold)}.game{max-width:1250px;margin:auto;padding:30px 4%;display:grid;grid-template-columns:1fr 270px;gap:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.muted{color:var(--muted)}.lifelines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.life{background:#ffffff0b;border:1px solid #ffffff22;border-radius:13px;padding:12px;color:white;cursor:pointer;font-weight:700}.life:disabled{opacity:.35;text-decoration:line-through}.question{background:linear-gradient(145deg,#182247,#101733);border:1px solid #ffffff20;border-radius:22px;padding:35px;min-height:220px}.category{color:#baa8ff;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:800;margin-bottom:18px}.qtext{font-size:clamp(23px,3vw,34px);font-weight:800;line-height:1.35}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.answer{min-height:70px;text-align:left;background:#151d3d;border:1px solid var(--line);color:white;border-radius:16px;padding:13px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700}.answer:hover{border-color:#a28eff}.answer .key{background:#745cff25;color:#c8bfff;border-radius:9px;padding:9px 11px}.answer.correct{border-color:var(--green);background:#4cda9a20}.answer.wrong{border-color:var(--red);background:#ff6b8520}.answer.hidden{visibility:hidden;pointer-events:none}.explain{display:none;margin-top:14px;padding:15px;border:1px solid #4cda9a55;background:#4cda9a12;border-radius:13px;line-height:1.5;color:#d8f6e8}.explain.show{display:block}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.quit{border:0;background:none;color:var(--muted);cursor:pointer}.ladder{background:#101733cc;border:1px solid #ffffff1c;border-radius:20px;padding:15px;height:max-content}.ladder h3{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em}.step{display:flex;justify-content:space-between;padding:7px 9px;color:#7f8bad;font-size:13px}.step.safe{color:var(--gold)}.step.current{background:#745cff55;border-radius:8px;color:white}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{max-width:520px;width:100%;background:#182044;border:1px solid #ffffff25;border-radius:20px;padding:25px}.bars{display:flex;align-items:end;gap:12px;height:160px}.barcol{flex:1;text-align:center}.bar{background:linear-gradient(#45d6ff,#745cff);border-radius:8px 8px 2px 2px;margin:8px auto;width:42px}.end{max-width:600px;margin:8vh auto;padding:55px 25px;text-align:center;background:#182044;border:1px solid #ffffff22;border-radius:25px}.prize{font-size:60px;color:var(--gold);font-weight:900;margin:25px}.stats{display:flex;justify-content:center;gap:30px;color:var(--muted);margin:25px}.stats b{display:block;color:white;font-size:22px}@media(max-width:800px){.welcome{padding:45px 20px}.orb{display:none}.game{grid-template-columns:1fr;padding:20px 14px}.answers{grid-template-columns:1fr}.lifelines{gap:6px}.life{font-size:11px;padding:10px 4px}.question{padding:25px}.ladder{order:2}}
</style></head><body>
<header class="top"><div class="logo"><b>Я</b><span>Русский на миллион</span></div><button class="icon" id="rules">?</button></header>
<section class="screen active" id="home"><div class="welcome"><div class="hero"><span class="tag">ИНТЕЛЛЕКТУАЛЬНАЯ ВИКТОРИНА</span><h1><span class="grad">Русский</span><br>на миллион</h1><p class="lead">15 вопросов по орфографии и пунктуации, три подсказки и несгораемые суммы.</p><button class="btn" id="start">Начать игру →</button><span class="note">Без регистрации</span></div><div class="orb">Я</div></div></section>
<section class="screen" id="game"><div class="game"><main><div class="head"><div><div class="muted">Текущий этап</div><b id="title">Вопрос 1 · 500 ₽</b></div><span class="muted" id="progress">1 / 15</span></div><div class="lifelines"><button class="life" id="fifty">50:50<br><small>убрать два</small></button><button class="life" id="audience">▥ Помощь зала</button><button class="life" id="expert">✦ Эксперт</button></div><div class="question"><div class="category" id="cat"></div><div class="qtext" id="q"></div></div><div class="answers" id="answers"></div><div class="explain" id="explain"></div><div class="bottom"><button class="quit" id="quit">Забрать выигрыш</button><button class="btn" id="next" style="display:none">Следующий вопрос →</button></div></main><aside class="ladder"><h3>Лестница выигрыша</h3><div id="ladder"></div><p class="muted" style="font-size:12px">◆ — несгораемая сумма</p></aside></div></section>
<section class="screen" id="end"><div class="end"><h1 id="endtitle">Игра окончена</h1><p class="muted" id="endsub"></p><div class="prize" id="prize">0 ₽</div><div class="stats"><div><b id="correct">0</b>верных</div><div><b id="left">3</b>подсказки</div></div><button class="btn" id="again">Сыграть ещё раз</button> <button class="btn secondary" id="home">На главную</button></div></section>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const sums=[500,1000,2000,3000,5000,10000,20000,50000,75000,100000,150000,250000,500000,750000,1000000];
const qs=[
['Орфография','В каком слове нужно писать букву «о»?',['к…ртина','м…роз','з…ря','тр…ва'],1,'Слово «мороз» проверяется формой «морозы».'],
['Пунктуация','В каком предложении нужна запятая?',['Солнце светит ярко.','Мама купила хлеб и молоко.','Наступил вечер и зажглись фонари.','Дети играют во дворе.'],2,'Это сложное предложение с двумя грамматическими основами.'],
['Орфография','Какое слово написано правильно?',['интиресный','интересный','интерестный','интирестный'],1,'Правильно: интересный.'],
['Орфография','В каком слове пишется мягкий знак?',['ноч…','врач…','плащ…','мяч…'],0,'Ночь — существительное женского рода третьего склонения.'],
['Пунктуация','Выберите правильно оформленное обращение.',['Маша принеси книгу.','Маша, принеси книгу.','Маша принеси, книгу.','Маша — принеси книгу.'],1,'Обращение отделяется запятой.'],
['Орфография','В каком слове после «ц» пишется «ы»?',['ц…рк','ц…тата','ц…плёнок','ц…фра'],2,'Цыплёнок — слово-исключение.'],
['Орфография','Где «не» пишется слитно?',['(не)был','(не)друг, а враг','совсем (не)интересный','(не)навидеть'],3,'Глагол ненавидеть без не не употребляется.'],
['Пунктуация','В каком варианте знаки расставлены верно?',['Если будет тепло мы пойдём гулять.','Если будет тепло, мы пойдём гулять.','Если, будет тепло мы пойдём гулять.','Если будет, тепло, мы пойдём гулять.'],1,'Придаточная часть отделяется запятой.'],
['Орфография','Укажите слово с приставкой «при-».',['пр…красный','пр…рвать','пр…ехать','пр…увеличить'],2,'Приехать обозначает приближение.'],
['Культура речи','Как правильно продолжить: «Благодаря…»',['сильного ветра','сильному ветру','сильным ветром','о сильном ветре'],1,'Предлог благодаря требует дательного падежа.'],
['Пунктуация','Где правильно выделено вводное слово?',['Он кажется устал.','Он, кажется устал.','Он кажется, устал.','Он, кажется, устал.'],3,'Вводное слово кажется обособляется с двух сторон.'],
['Орфография','В каком ряду все слова пишутся через дефис?',['по-новому, когда-то','в течение, кто-либо','из-за, как будто','полчаса, по-русски'],0,'По-новому и когда-то пишутся через дефис.'],
['Орфография','В каком слове пишется одна буква «н»?',['стекля…ый','ветре…ый','деревя…ый','безветре…ый'],1,'Ветреный — слово-исключение.'],
['Пунктуация','В каком предлоении оборот оформлен верно?',['Подъезжая к станции у меня слетела шляпа.','Подъезжая к станции, я увидел перрон.','Я подъезжая к станции, увидел перрон.','Я увидел, подъезжая к станции перрон.'],1,'Деепричастный оборот относится к подлежащему я.'],
['Орфография','В каком предложении «также» пишется слитно?',['Он сделал так же, как вчера.','Я также хочу участвовать.','Это был тот же дом.','Она говорила так же тихо.'],1,'Союз также имеет значение тоже.']
];
let S={n:0,right:0,used:{f:false,a:false,e:false},answered:false,set:[]};const $=id=>document.getElementById(id);const fmt=n=>n.toLocaleString('ru-RU')+' ₽';
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
function ladder(){ $('ladder').innerHTML=sums.map((x,i)=>`<div class="step ${[4,9,14].includes(i)?'safe':''} ${i===S.n?'current':''} ${i<S.n?'passed':''}"><span>${i+1}${[4,9,14].includes(i)?' ◆':''}</span><span>${fmt(x)}</span></div>`).reverse().join('') }
function start(){S={n:0,right:0,used:{f:false,a:false,e:false},answered:false,set:qs.slice().sort(()=>Math.random()-.5)};show('game');load()}
function load(){S.answered=false;let x=S.set[S.n];$('title').textContent=`Вопрос ${S.n+1} · ${fmt(sums[S.n])}`;$('progress').textContent=`${S.n+1} / 15`;$('cat').textContent=x[0];$('q').textContent=x[1];$('explain').classList.remove('show');$('next').style.display='none';$('answers').innerHTML=x[2].map((a,i)=>`<button class="answer" data-i="${i}"><span class="key">${'АБВГ'[i]}</span><span>${a}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));sync();ladder()}
function answer(i){if(S.answered)return;S.answered=true;let x=S.set[S.n];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.querySelector(`[data-i="${x[3]}"]`).classList.add('correct');let ok=i===x[3];if(!ok)document.querySelector(`[data-i="${i}"]`).classList.add('wrong');else S.right++;$('explain').innerHTML=`<b>${ok?'Верно!':'Правильный ответ: '+ 'АБВГ'[x[3]]+'.'}</b> ${x[4]}`;$('explain').classList.add('show');$('next').textContent=ok?(S.n===14?'Забрать миллион':'Следующий вопрос →'):'Посмотреть результат';$('next').style.display='inline-block'}
function next(){let wrong=document.querySelector('.wrong');if(wrong){finish(S.n>=10?100000:S.n>=5?5000:0);return}if(S.n===14){finish(1000000);return}S.n++;load()}
function finish(p){$('prize').textContent=fmt(p);$('correct').textContent=S.right;$('left').textContent=3-Object.values(S.used).filter(Boolean).length;$('endtitle').textContent=p===1000000?'Вы покорили русский!':'Игра окончена';$('endsub').textContent=p===1000000?'Все 15 этапов пройдены.':'Ваш результат зафиксирован.';show('end')}
function sync(){$('fifty').disabled=S.used.f||S.answered;$('audience').disabled=S.used.a||S.answered;$('expert').disabled=S.used.e||S.answered}
function modal(t){$('modalbox').innerHTML=t;$('modal').classList.add('show')}
function fifty(){if(S.used.f||S.answered)return;S.used.f=true;let x=S.set[S.n];[0,1,2,3].filter(i=>i!==x[3]).sort(()=>Math.random()-.5).slice(0,2).forEach(i=>document.querySelector(`[data-i="${i}"]`).classList.add('hidden'));sync()}
function audience(){if(S.used.a||S.answered)return;S.used.a=true;let x=S.set[S.n],good=55+Math.floor(Math.random()*20),rest=100-good,v=[0,0,0,0];v[x[3]]=good;let w=[0,1,2,3].filter(i=>i!==x[3]);v[w[0]]=Math.floor(rest*.5);v[w[1]]=Math.floor(rest*.3);v[w[2]]=rest-v[w[0]]-v[w[1]];modal(`<h2>Мнение зала</h2><p>Результаты голосования:</p><div class="bars">${v.map((n,i)=>`<div class="barcol"><b>${n}%</b><div class="bar" style="height:${n*1.2}px"></div><span>${'АБВГ'[i]}</span></div>`).join('')}</div><br><button class="btn" onclick="$('modal').classList.remove('show')">Понятно</button>`);sync()}
function expert(){if(S.used.e||S.answered)return;S.used.e=true;let x=S.set[S.n];modal(`<h2>Совет эксперта</h2><p>Я бы выбрал вариант <b>${'АБВГ'[x[3]]}</b>. Обратите внимание на правило, а не только на звучание.</p><button class="btn" onclick="$('modal').classList.remove('show')">Спасибо</button>`);sync()}
$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>show('home');$('next').onclick=next;$('fifty').onclick=fifty;$('audience').onclick=audience;$('expert').onclick=expert;$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};$('quit').onclick=()=>finish(S.n? sums[S.n-1]:0);$('rules').onclick=()=>modal('<h2>Как играть</h2><p>Ответьте на 15 вопросов. Используйте 50:50, помощь зала и совет эксперта. Несгораемые суммы: 5 000, 100 000 и 1 000 000 ₽.</p><button class="btn" onclick="$(\'modal\').classList.remove(\'show\')">Понятно</button>');
</script></body></html>
